kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 9092   # Kafka
    hostPort: 9092
  - containerPort: 8081   # Flink UI (tùy chọn)
    hostPort: 8081
  - containerPort: 9000   # MinIO
    hostPort: 9000
  - containerPort: 3000   # Grafana (tùy chọn)
    hostPort: 3000
- role: worker
- role: worker