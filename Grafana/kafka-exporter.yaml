apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-exporter

  template:
    metadata:
      labels:
        app: kafka-exporter

    spec:
      containers:
        - name: kafka-exporter

          image: danielqsj/kafka-exporter:latest

          args:
            - --kafka.server=kafka-0.kafka:29092
            - --kafka.server=kafka-1.kafka:29092
            - --kafka.server=kafka-2.kafka:29092

          ports:
            - containerPort: 9308

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service

metadata:
  name: kafka-exporter

spec:
  selector:
    app: kafka-exporter

  ports:
    - name: metrics
      port: 9308
      targetPort: 9308